<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone Engine — Test Harness</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="login-container" style="width: 600px;">
        <h1>Engine Test</h1>

        <label>Drone ID</label><input type="text" id="droneId" value="HIVE-01">
        <button id="loadDrone">Load Drone</button>

        <label>X (m)</label><input type="number" id="destX" value="0">
        <label>Y (m)</label><input type="number" id="destY" value="0">
        <label>Z (m)</label><input type="number" id="destZ" value="0">
        <button id="sendCommand">Send Command</button>
        <button id="cancelCommand">Cancel Active Command</button>
        <p id="statusLine" style="min-height:1.4rem;"></p>

        <pre id="output" style="text-align:left; background:#08161f; padding:1rem; margin-top:1rem; max-height:400px; overflow:auto;"></pre>
    </div>

    <script type="module">
      import { issueCommand, cancelActiveCommand, catchUpDrone, listenToDrone } from "../../js/games/hive-drone-explorer/drone-engine.js";

      const GROUP = "HIVE";
      const output = document.getElementById("output");
      const statusLine = document.getElementById("statusLine");
      let currentDroneId = document.getElementById("droneId").value.trim();
      let unsubscribeDrone = null;

      function bindDrone(droneId) {
        if (unsubscribeDrone) unsubscribeDrone();
        currentDroneId = droneId;
        output.textContent = "";
        statusLine.textContent = `Loading ${currentDroneId}...`;
        statusLine.style.color = "#7fd8ff";
        unsubscribeDrone = listenToDrone(GROUP, currentDroneId, renderDrone);
        catchUpDrone(GROUP, currentDroneId);
      }

      function renderDrone(drone) {
        output.textContent = JSON.stringify(drone, null, 2);
        if (!drone) {
          statusLine.textContent = `No ${currentDroneId} document. Use the admin reset first.`;
          statusLine.style.color = "#ffcc66";
        } else if (drone.status === "destroyed") {
          statusLine.textContent = `DESTROYED at X${drone.destructionPoint?.x}, Y${drone.destructionPoint?.y}, Z${drone.destructionPoint?.z}`;
          statusLine.style.color = "#ff6b6b";
        } else if (drone.hazardWarning?.active) {
          statusLine.textContent = `WARNING: impact risk with ${drone.hazardWarning.label} within ${drone.hazardWarning.distanceBeforeImpactM} m. Cancel now to abort.`;
          statusLine.style.color = "#ffcc66";
        } else {
          statusLine.textContent = `Status: ${drone.status}`;
          statusLine.style.color = "#7fd8ff";
        }
      }

      bindDrone(currentDroneId);

      document.getElementById("loadDrone").addEventListener("click", () => {
        bindDrone(document.getElementById("droneId").value.trim());
      });

      document.getElementById("sendCommand").addEventListener("click", () => {
        issueCommand(GROUP, currentDroneId, {
          x: Number(document.getElementById("destX").value),
          y: Number(document.getElementById("destY").value),
          z: Number(document.getElementById("destZ").value)
        });
      });

      document.getElementById("cancelCommand").addEventListener("click", () => {
        cancelActiveCommand(GROUP, currentDroneId);
      });
    </script>
</body>
</html>
