<!-- HIVE game page: drone release/movement control panel. Participant-only, HIVE group. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enceladus Mission Simulator - HIVE - Drone Operations</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .ops-layout {
            display: flex;
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
            box-sizing: border-box;
            align-items: flex-start;
        }
        .panel {
            background: #12293d;
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }
        .fleet-panel { flex: 2; min-width: 0; }
        .viz-panel { flex: 2; min-width: 320px; }
        .command-panel { flex: 1; min-width: 280px; position: sticky; top: 1rem; }
        .ops-layout { flex-wrap: wrap; }

        .viz-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
        .viz-tab-btn {
            background: #1c3c56;
            color: #a8cbe0;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .viz-tab-btn.active { background: #2f9bd6; color: white; }
        .viz-tab-content { display: none; }
        .viz-tab-content.active { display: block; }

        #viz-2d-canvas {
            background: #08161f;
            border-radius: 6px;
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }
        .depth-slider-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }
        .depth-slider-row input[type="range"] { flex: 1; }
        #depth-label {
            font-size: 0.78rem;
            color: #a8cbe0;
            white-space: nowrap;
            min-width: 95px;
            text-align: right;
        }

        #viz-3d-container {
            width: 100%;
            height: 380px;
            border-radius: 6px;
            overflow: hidden;
            background: #08161f;
        }

        .viz-legend {
            display: flex;
            gap: 1rem;
            margin-top: 0.6rem;
            font-size: 0.72rem;
            color: #a8cbe0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.3rem;
            vertical-align: middle;
        }

        table.fleet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .fleet-table th {
            text-align: left;
            color: #a8cbe0;
            padding: 0.4rem;
            border-bottom: 1px solid #1c3c56;
            position: sticky;
            top: 0;
            background: #12293d;
        }
        .fleet-table td {
            padding: 0.4rem;
            border-bottom: 1px solid #1c3c56;
            vertical-align: top;
        }
        .fleet-scroll {
            max-height: 70vh;
            overflow-y: auto;
        }

        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .status-awaiting_command { background: #2c4a5e; color: #a8cbe0; }
        .status-in_route { background: #1c4a72; color: #7fd8ff; }
        .status-collecting_sample { background: #235c3a; color: #9dffbf; }
        .status-destroyed { background: #5c2323; color: #ff9d9d; }

        .warning-text {
            color: #ffcf6b;
            font-weight: bold;
            font-size: 0.78rem;
        }
        .destruction-text {
            color: #ff8080;
            font-size: 0.78rem;
        }
        .position-text {
            font-family: monospace;
            font-size: 0.8rem;
            color: #cfeaff;
        }
        .queue-count {
            font-size: 0.75rem;
            color: #7fa8c4;
        }

        .cancel-btn {
            background: #a83232;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .cancel-btn:disabled {
            background: #3a3a3a;
            color: #777;
            cursor: not-allowed;
        }

        .command-panel label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: #a8cbe0; }
        .command-panel select, .command-panel input {
            width: 100%;
            padding: 0.4rem;
            margin-top: 0.25rem;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        .command-panel button {
            margin-top: 1rem;
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 5px;
            background: #2f9bd6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .command-panel button:hover { background: #237bab; }

        .queue-list {
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .queue-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0;
            border-bottom: 1px solid #1c3c56;
        }
        .queue-remove-btn {
            background: none;
            border: 1px solid #a83232;
            color: #ff9d9d;
            border-radius: 4px;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            cursor: pointer;
        }

        .feedback-msg {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            min-height: 1rem;
        }
        .feedback-msg.error { color: #ff8080; }
        .feedback-msg.success { color: #9dffbf; }

        h1, h2 { margin-top: 0; }
        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.05rem; color: #a8cbe0; }
    </style>
</head>
<body>

    <div class="ops-layout">
        <div class="panel fleet-panel">
            <h1>HIVE Drone Fleet</h1>
            <div class="fleet-scroll">
                <table class="fleet-table">
                    <thead>
                        <tr>
                            <th>Drone</th>
                            <th>Status</th>
                            <th>Position / En Route To</th>
                            <th>Queue</th>
                            <th>Warning</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="fleet-table-body">
                        <!-- rows populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel viz-panel">
            <h2>Mission Map</h2>
            <div class="viz-tabs">
                <button class="viz-tab-btn active" data-tab="2d" id="tab-btn-2d">2D Map</button>
                <button class="viz-tab-btn" data-tab="3d" id="tab-btn-3d">3D Cube</button>
            </div>

            <div id="tab-2d" class="viz-tab-content active">
                <canvas id="viz-2d-canvas" width="360" height="360"></canvas>
                <div class="depth-slider-row">
                    <input type="range" id="depth-slider" min="0" max="70" step="1" value="0">
                    <span id="depth-label">Layer: 0 km</span>
                </div>
            </div>

            <div id="tab-3d" class="viz-tab-content">
                <div id="viz-3d-container"></div>
            </div>

            <div class="viz-legend">
                <span><span class="legend-dot" style="background:#a8cbe0;"></span>Awaiting</span>
                <span><span class="legend-dot" style="background:#7fd8ff;"></span>En route</span>
                <span><span class="legend-dot" style="background:#9dffbf;"></span>Collecting</span>
                <span><span class="legend-dot" style="background:#ff4d4d;"></span>Destroyed</span>
            </div>
        </div>

        <div class="panel command-panel">
            <h2>Issue Command</h2>

            <label for="drone-select">Select Drone</label>
            <select id="drone-select"></select>

            <label for="dest-x">X (m)</label>
            <input type="number" id="dest-x" value="0">
            <label for="dest-y">Y (m)</label>
            <input type="number" id="dest-y" value="0">
            <label for="dest-z">Z (m)</label>
            <input type="number" id="dest-z" value="0">

            <button id="queue-command-btn">Queue Command</button>
            <p id="command-feedback" class="feedback-msg"></p>

            <h2>Queued Commands</h2>
            <p class="queue-count" id="queue-summary">Select a drone to view its queue.</p>
            <ul class="queue-list" id="queue-list"></ul>
        </div>
    </div>

    <script src="../../js/auth-guard.js"></script>
    <script>
      const user = requireAuth("participant", "HIVE", "../../index.html");
    </script>

    <script type="module">
      import { MISSION_CONFIG } from "../../js/games/hive-drone-explorer/config.js";
      import {
        issueCommand, cancelActiveCommand, removeQueuedCommand, catchUpDrone, listenToDrone
      } from "../../js/games/hive-drone-explorer/drone-engine.js";

      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
      import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

      const GROUP = "HIVE";
      const DRONE_IDS = Array.from({ length: MISSION_CONFIG.DRONE_COUNT }, (_, i) =>
        `${GROUP}-${String(i + 1).padStart(2, "0")}`
      );

      const droneState = {}; // droneId -> latest Firestore data
      let selectedDroneId = DRONE_IDS[0];

      // --- Build the drone selector dropdown once ---
      const selectEl = document.getElementById("drone-select");
      DRONE_IDS.forEach((id) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        selectEl.appendChild(opt);
      });
      selectEl.value = selectedDroneId;
      selectEl.addEventListener("change", () => {
        selectedDroneId = selectEl.value;
        renderQueuePanel();
      });

      // --- Build one table row per drone, plus subscribe to live updates ---
      const tbody = document.getElementById("fleet-table-body");

      function formatPosition(pos) {
        if (!pos) return "—";
        return `(${pos.x}, ${pos.y}, ${pos.z})`;
      }

      function positionOrEnRouteText(drone) {
        const queue = drone.commandQueue || [];
        if (drone.status === "in_route" && queue.length > 0) {
          return `→ ${formatPosition(queue[0].destination)}`;
        }
        if (drone.status === "collecting_sample" && queue.length > 0) {
          return `Collecting at ${formatPosition(queue[0].destination)}`;
        }
        if (drone.status === "destroyed") {
          return `Lost at ${formatPosition(drone.destructionPoint)}`;
        }
        return formatPosition(drone.position);
      }

      function warningText(drone) {
        // Deliberately generic: participants should discover what they hit
        // through play, not read it off a label. The real cause/label is
        // still stored in Firestore (drone.destruction / drone.hazardWarning)
        // for your own debugging/admin use — just not surfaced here.
        if (drone.status === "destroyed") {
          return `<span class="destruction-text">Destroyed</span>`;
        }
        const w = drone.hazardWarning;
        if (w && w.active) {
          return `<span class="warning-text">⚠ Proximity warning — ${w.distanceBeforeImpactM}m</span>`;
        }
        return "";
      }

      function buildRow(droneId) {
        const tr = document.createElement("tr");
        tr.id = `row-${droneId}`;
        tr.innerHTML = `
          <td>${droneId}</td>
          <td class="cell-status"></td>
          <td class="cell-position position-text"></td>
          <td class="cell-queue queue-count"></td>
          <td class="cell-warning"></td>
          <td><button class="cancel-btn" data-drone="${droneId}">Cancel</button></td>
        `;
        return tr;
      }

      DRONE_IDS.forEach((id) => tbody.appendChild(buildRow(id)));

      tbody.addEventListener("click", (e) => {
        const btn = e.target.closest(".cancel-btn");
        if (!btn) return;
        cancelActiveCommand(GROUP, btn.dataset.drone);
      });

      function renderRow(droneId, drone) {
        const row = document.getElementById(`row-${droneId}`);
        if (!row || !drone) return;

        const statusCell = row.querySelector(".cell-status");
        statusCell.innerHTML = `<span class="status-badge status-${drone.status}">${drone.status.replace("_", " ")}</span>`;

        row.querySelector(".cell-position").textContent = positionOrEnRouteText(drone);

        const queueLength = (drone.commandQueue || []).length;
        row.querySelector(".cell-queue").textContent = queueLength > 0 ? `${queueLength} queued` : "—";

        row.querySelector(".cell-warning").innerHTML = warningText(drone);

        const cancelBtn = row.querySelector(".cancel-btn");
        cancelBtn.disabled = drone.status !== "in_route";
      }

      // --- Command entry ---
      const feedbackEl = document.getElementById("command-feedback");

      document.getElementById("queue-command-btn").addEventListener("click", async () => {
        const destination = {
          x: Number(document.getElementById("dest-x").value),
          y: Number(document.getElementById("dest-y").value),
          z: Number(document.getElementById("dest-z").value)
        };

        feedbackEl.textContent = "";
        feedbackEl.className = "feedback-msg";

        try {
          await issueCommand(GROUP, selectedDroneId, destination);
          feedbackEl.textContent = `Command queued for ${selectedDroneId}.`;
          feedbackEl.classList.add("success");
        } catch (err) {
          feedbackEl.textContent = err.message;
          feedbackEl.classList.add("error");
        }
      });

      // --- Queue panel for the selected drone (edit/cancel not-yet-active commands) ---
      const queueSummaryEl = document.getElementById("queue-summary");
      const queueListEl = document.getElementById("queue-list");

      function renderQueuePanel() {
        const drone = droneState[selectedDroneId];
        queueListEl.innerHTML = "";

        if (!drone) {
          queueSummaryEl.textContent = "No data yet for this drone.";
          return;
        }

        const queue = drone.commandQueue || [];
        if (queue.length === 0) {
          queueSummaryEl.textContent = `${selectedDroneId} has no queued commands.`;
          return;
        }

        queueSummaryEl.textContent = `${selectedDroneId}: ${queue.length} command(s) in queue.`;

        queue.forEach((cmd, idx) => {
          const li = document.createElement("li");
          const label = idx === 0
            ? `Active → ${formatPosition(cmd.destination)}`
            : `#${idx + 1} → ${formatPosition(cmd.destination)}`;

          li.innerHTML = `<span>${label}</span>`;

          if (idx > 0) {
            const removeBtn = document.createElement("button");
            removeBtn.className = "queue-remove-btn";
            removeBtn.textContent = "Remove";
            removeBtn.addEventListener("click", () => {
              removeQueuedCommand(GROUP, selectedDroneId, cmd.commandId);
            });
            li.appendChild(removeBtn);
          } else {
            const hint = document.createElement("span");
            hint.className = "queue-count";
            hint.textContent = "use Cancel in fleet table";
            li.appendChild(hint);
          }

          queueListEl.appendChild(li);
        });
      }

      // ================= Visualization: shared helpers =================
      // Uses the SAME droneState object already populated by the fleet
      // table's listeners below — no separate Firestore subscriptions.

      const GRID_X_M = MISSION_CONFIG.GRID_X_KM * 1000;
      const GRID_Y_M = MISSION_CONFIG.GRID_Y_KM * 1000;
      const DISPLAY_Z_KM = MISSION_CONFIG.DISPLAY_Z_KM; // false depth framing — real floor is deeper

      const STATUS_COLORS = {
        awaiting_command: "#a8cbe0",
        in_route: "#7fd8ff",
        collecting_sample: "#9dffbf",
        destroyed: "#ff4d4d"
      };

      // A drone's position for display purposes: while destroyed, use the
      // fixed destruction point (drone.position itself isn't updated after
      // destruction). Note: this reflects the drone's LAST KNOWN waypoint —
      // it isn't interpolated continuously mid-transit, same as the fleet
      // table's position column.
      function effectivePosition(drone) {
        if (drone.status === "destroyed") return drone.destructionPoint || drone.position;
        return drone.position;
      }

      // Rounds to the NEAREST 1km layer (not floored) per the "closest
      // km slice" rule — e.g. z=39600 shows on layer 40, z=39300 on layer 39.
      function nearestKmLayer(zMeters) {
        return Math.round(zMeters / 1000);
      }

      // ================= 2D top-down + depth slider =================
      const canvas2d = document.getElementById("viz-2d-canvas");
      const ctx2d = canvas2d.getContext("2d");
      const depthSlider = document.getElementById("depth-slider");
      const depthLabel = document.getElementById("depth-label");
      depthSlider.max = String(DISPLAY_Z_KM);

      function draw2D() {
        const layer = Number(depthSlider.value);
        depthLabel.textContent = `Layer: ${layer} km`;

        ctx2d.clearRect(0, 0, canvas2d.width, canvas2d.height);
        ctx2d.strokeStyle = "#1c3c56";
        ctx2d.lineWidth = 1;
        ctx2d.strokeRect(0, 0, canvas2d.width, canvas2d.height);

        Object.entries(droneState).forEach(([droneId, drone]) => {
          if (!drone) return;
          const pos = effectivePosition(drone);
          if (!pos) return;
          if (nearestKmLayer(pos.z) !== layer) return;

          const px = (pos.x / GRID_X_M) * canvas2d.width;
          const py = (pos.y / GRID_Y_M) * canvas2d.height;

          ctx2d.beginPath();
          ctx2d.arc(px, py, drone.status === "destroyed" ? 5 : 4, 0, Math.PI * 2);
          ctx2d.fillStyle = STATUS_COLORS[drone.status] || "#ffffff";
          ctx2d.fill();
        });
      }

      depthSlider.addEventListener("input", draw2D);

      // ================= 3D cube (three.js, lazy-initialized) =================
      let scene, camera, renderer, controls;
      const droneMeshes = {}; // droneId -> THREE.Mesh
      let animationFrameId = null;
      let threeInitialized = false;
      let active3D = false;

      function sceneX(posXMeters) { return (posXMeters / 1000) - (MISSION_CONFIG.GRID_X_KM / 2); }
      function sceneZ(posYMeters) { return (posYMeters / 1000) - (MISSION_CONFIG.GRID_Y_KM / 2); }
      function sceneY(posZMeters) { return -(posZMeters / 1000); } // deeper = further down

      function init3D() {
        if (threeInitialized) return;
        threeInitialized = true;

        const container = document.getElementById("viz-3d-container");

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x08161f);

        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(15, 12, 22);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, -DISPLAY_Z_KM / 2, 0);
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        // Wireframe box representing the mission volume, using the FALSE
        // depth framing (stated drone depth rating) — never the true floor.
        const boxGeom = new THREE.BoxGeometry(
          MISSION_CONFIG.GRID_X_KM, DISPLAY_Z_KM, MISSION_CONFIG.GRID_Y_KM
        );
        const edges = new THREE.EdgesGeometry(boxGeom);
        const boxLines = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x2f9bd6 }));
        boxLines.position.set(0, -DISPLAY_Z_KM / 2, 0); // surface (y=0) at the top face
        scene.add(boxLines);

        window.addEventListener("resize", resize3D);
      }

      function resize3D() {
        if (!renderer) return;
        const container = document.getElementById("viz-3d-container");
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function getOrCreateMesh(droneId) {
        if (droneMeshes[droneId]) return droneMeshes[droneId];
        const geom = new THREE.SphereGeometry(0.15, 12, 12);
        const mat = new THREE.MeshStandardMaterial({ color: 0xa8cbe0 });
        const mesh = new THREE.Mesh(geom, mat);
        scene.add(mesh);
        droneMeshes[droneId] = mesh;
        return mesh;
      }

      function draw3D() {
        if (!scene) return;
        Object.entries(droneState).forEach(([droneId, drone]) => {
          if (!drone) return;
          const pos = effectivePosition(drone);
          if (!pos) return;

          const mesh = getOrCreateMesh(droneId);
          mesh.position.set(sceneX(pos.x), sceneY(pos.z), sceneZ(pos.y));
          mesh.material.color.set(STATUS_COLORS[drone.status] || "#ffffff");
          mesh.scale.setScalar(drone.status === "destroyed" ? 1.6 : 1);
        });
      }

      function animate3D() {
        if (!active3D) return;
        animationFrameId = requestAnimationFrame(animate3D);
        controls.update();
        renderer.render(scene, camera);
      }

      // ================= Tab switching =================
      const tabBtn2d = document.getElementById("tab-btn-2d");
      const tabBtn3d = document.getElementById("tab-btn-3d");
      const tabContent2d = document.getElementById("tab-2d");
      const tabContent3d = document.getElementById("tab-3d");

      function showTab(tab) {
        const is2d = tab === "2d";
        tabBtn2d.classList.toggle("active", is2d);
        tabBtn3d.classList.toggle("active", !is2d);
        tabContent2d.classList.toggle("active", is2d);
        tabContent3d.classList.toggle("active", !is2d);

        active3D = !is2d;

        if (active3D) {
          init3D();
          resize3D();
          animate3D();
          draw3D();
        } else {
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
          draw2D();
        }
      }

      tabBtn2d.addEventListener("click", () => showTab("2d"));
      tabBtn3d.addEventListener("click", () => showTab("3d"));

      draw2D(); // initial render (empty grid) before any drone data arrives

      // --- Subscribe to every drone, catch up any missed time, keep UI live ---
      DRONE_IDS.forEach((droneId) => {
        catchUpDrone(GROUP, droneId);
        listenToDrone(GROUP, droneId, (drone) => {
          droneState[droneId] = drone;
          if (drone) renderRow(droneId, drone);
          if (droneId === selectedDroneId) renderQueuePanel();
          if (active3D) draw3D(); else draw2D();
        });
      });
    </script>
</body>
</html>
