<!-- HIVE game page: drone release/movement control panel. Participant-only, HIVE group. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enceladus Mission Simulator - HIVE - Drone Operations</title>
    <link rel="stylesheet" href="../../css/style.css">

    <!-- Import map: required so three.js's own internal modules (like
         OrbitControls) can resolve "three" as a bare specifier. Without
         this, the 3D view fails to load silently. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <style>
        /* Override the shared login-page body layout for this page —
           that stylesheet centers a fixed-height box, which isn't right
           for a wide, potentially-tall control panel like this one. */
        body {
            display: block;
            height: auto;
            min-height: 100vh;
            align-items: normal;
            justify-content: normal;
            overflow-x: auto;
        }

        .ops-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            width: 100%;
            max-width: 1700px;
            margin: 0 auto;
            padding: 1.5rem;
            box-sizing: border-box;
            align-items: flex-start;
        }
        .panel {
            background: #12293d;
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }
        .fleet-panel { flex: 2; min-width: 420px; }
        .command-panel { flex: 1; min-width: 300px; position: sticky; top: 1rem; }

        table.fleet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .fleet-table th {
            text-align: left;
            color: #a8cbe0;
            padding: 0.4rem;
            border-bottom: 1px solid #1c3c56;
            position: sticky;
            top: 0;
            background: #12293d;
        }
        .fleet-table td {
            padding: 0.4rem;
            border-bottom: 1px solid #1c3c56;
            vertical-align: top;
        }
        .fleet-scroll {
            max-height: 70vh;
            overflow-y: auto;
        }

        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .status-awaiting_command { background: #2c4a5e; color: #a8cbe0; }
        .status-in_route { background: #1c4a72; color: #7fd8ff; }
        .status-collecting_sample { background: #235c3a; color: #9dffbf; }
        .status-destroyed { background: #5c2323; color: #ff9d9d; }

        .warning-text {
            color: #ffcf6b;
            font-weight: bold;
            font-size: 0.78rem;
        }
        .destruction-text {
            color: #ff8080;
            font-size: 0.78rem;
        }
        .position-text {
            font-family: monospace;
            font-size: 0.8rem;
            color: #cfeaff;
        }
        .queue-count {
            font-size: 0.75rem;
            color: #7fa8c4;
        }

        .cancel-btn {
            background: #a83232;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .cancel-btn:disabled {
            background: #3a3a3a;
            color: #777;
            cursor: not-allowed;
        }

        .command-panel label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: #a8cbe0; }
        .command-panel select, .command-panel input {
            width: 100%;
            padding: 0.4rem;
            margin-top: 0.25rem;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        .command-panel button {
            margin-top: 1rem;
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 5px;
            background: #2f9bd6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .command-panel button:hover { background: #237bab; }

        .queue-list {
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .queue-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0;
            border-bottom: 1px solid #1c3c56;
        }
        .queue-remove-btn {
            background: none;
            border: 1px solid #a83232;
            color: #ff9d9d;
            border-radius: 4px;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            cursor: pointer;
        }

        .feedback-msg {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            min-height: 1rem;
        }
        .feedback-msg.error { color: #ff8080; }
        .feedback-msg.success { color: #9dffbf; }

        h1, h2 { margin-top: 0; }
        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.05rem; color: #a8cbe0; }

        /* ===== Visualization panel ===== */
        .viz-panel { flex: 2; min-width: 420px; }

        .viz-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
        .viz-tab-btn {
            background: #1c3c56;
            color: #a8cbe0;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .viz-tab-btn.active { background: #2f9bd6; color: white; }
        .viz-tab-content { display: none; }
        .viz-tab-content.active { display: block; }

        #viz-2d-canvas {
            background: #08161f;
            border-radius: 6px;
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        .depth-slider-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }
        .depth-slider-row input[type="range"] { flex: 1; }
        #depth-label {
            font-size: 0.78rem;
            color: #a8cbe0;
            white-space: nowrap;
            min-width: 95px;
            text-align: right;
        }

        #viz-3d-container {
            width: 100%;
            height: 420px;
            border-radius: 6px;
            overflow: hidden;
            background: #08161f;
        }

        .viz-legend {
            display: flex;
            gap: 1rem;
            margin-top: 0.6rem;
            font-size: 0.72rem;
            color: #a8cbe0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.3rem;
            vertical-align: middle;
        }
        .viz-error-msg {
            color: #ff9d9d;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="ops-layout">
        <div class="panel fleet-panel">
            <h1>HIVE Drone Fleet</h1>
            <div class="fleet-scroll">
                <table class="fleet-table">
                    <thead>
                        <tr>
                            <th>Drone</th>
                            <th>Status</th>
                            <th>Position / En Route To</th>
                            <th>Queue</th>
                            <th>Warning</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="fleet-table-body">
                        <!-- rows populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel viz-panel">
            <h2>Ocean Map</h2>
            <div class="viz-tabs">
                <button class="viz-tab-btn active" data-tab="2d" id="tab-btn-2d">2D Map</button>
                <button class="viz-tab-btn" data-tab="3d" id="tab-btn-3d">3D Cube</button>
            </div>

            <div id="tab-2d" class="viz-tab-content active">
                <canvas id="viz-2d-canvas" width="420" height="420"></canvas>
                <div class="depth-slider-row">
                    <input type="range" id="depth-slider" min="0" max="70" step="1" value="0">
                    <span id="depth-label">Layer: 0 km</span>
                </div>
            </div>

            <div id="tab-3d" class="viz-tab-content">
                <div id="viz-3d-container"></div>
            </div>

            <div class="viz-legend">
                <span><span class="legend-dot" style="background:#a8cbe0;"></span>Awaiting</span>
                <span><span class="legend-dot" style="background:#ffb347;"></span>En route</span>
                <span><span class="legend-dot" style="background:#9dffbf;"></span>Collecting</span>
                <span><span class="legend-dot" style="background:#ff4d4d;"></span>Destroyed</span>
            </div>
            <p class="viz-error-msg" id="viz-error-msg"></p>
        </div>

        <div class="panel command-panel">
            <h2>Issue Command</h2>

            <label for="drone-select">Select Drone</label>
            <select id="drone-select"></select>

            <label for="dest-x">X (m)</label>
            <input type="number" id="dest-x" value="0">
            <label for="dest-y">Y (m)</label>
            <input type="number" id="dest-y" value="0">
            <label for="dest-z">Z (m)</label>
            <input type="number" id="dest-z" value="0">

            <button id="queue-command-btn">Queue Command</button>
            <p id="command-feedback" class="feedback-msg"></p>

            <h2>Queued Commands</h2>
            <p class="queue-count" id="queue-summary">Select a drone to view its queue.</p>
            <ul class="queue-list" id="queue-list"></ul>
        </div>
    </div>

    <script src="../../js/auth-guard.js"></script>
    <script>
      const user = requireAuth("participant", "HIVE", "../../index.html");
    </script>

    <!-- ORIGINAL, CONFIRMED-WORKING SCRIPT — UNCHANGED. -->
    <script type="module">
      import { MISSION_CONFIG } from "../../js/games/hive-drone-explorer/config.js";
      import {
        issueCommand, cancelActiveCommand, removeQueuedCommand, catchUpDrone, listenToDrone
      } from "../../js/games/hive-drone-explorer/drone-engine.js";

      const GROUP = "HIVE";
      const DRONE_IDS = Array.from({ length: MISSION_CONFIG.DRONE_COUNT }, (_, i) =>
        `${GROUP}-${String(i + 1).padStart(2, "0")}`
      );

      const droneState = {};
      let selectedDroneId = DRONE_IDS[0];

      const selectEl = document.getElementById("drone-select");
      DRONE_IDS.forEach((id) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        selectEl.appendChild(opt);
      });
      selectEl.value = selectedDroneId;
      selectEl.addEventListener("change", () => {
        selectedDroneId = selectEl.value;
        renderQueuePanel();
      });

      const tbody = document.getElementById("fleet-table-body");

      function formatPosition(pos) {
        if (!pos) return "—";
        return `(${pos.x}, ${pos.y}, ${pos.z})`;
      }

      function positionOrEnRouteText(drone) {
        const queue = drone.commandQueue || [];
        if (drone.status === "in_route" && queue.length > 0) {
          return `→ ${formatPosition(queue[0].destination)}`;
        }
        if (drone.status === "collecting_sample" && queue.length > 0) {
          return `Collecting at ${formatPosition(queue[0].destination)}`;
        }
        if (drone.status === "destroyed") {
          return `Lost at ${formatPosition(drone.destructionPoint)}`;
        }
        return formatPosition(drone.position);
      }

      function warningText(drone) {
        if (drone.status === "destroyed") {
          return `<span class="destruction-text">Destroyed</span>`;
        }
        const w = drone.hazardWarning;
        if (w && w.active) {
          return `<span class="warning-text">⚠ Proximity warning — ${w.distanceBeforeImpactM}m</span>`;
        }
        return "";
      }

      function buildRow(droneId) {
        const tr = document.createElement("tr");
        tr.id = `row-${droneId}`;
        tr.innerHTML = `
          <td>${droneId}</td>
          <td class="cell-status"></td>
          <td class="cell-position position-text"></td>
          <td class="cell-queue queue-count"></td>
          <td class="cell-warning"></td>
          <td><button class="cancel-btn" data-drone="${droneId}">Cancel</button></td>
        `;
        return tr;
      }

      DRONE_IDS.forEach((id) => tbody.appendChild(buildRow(id)));

      tbody.addEventListener("click", (e) => {
        const btn = e.target.closest(".cancel-btn");
        if (!btn) return;
        cancelActiveCommand(GROUP, btn.dataset.drone);
      });

      function renderRow(droneId, drone) {
        const row = document.getElementById(`row-${droneId}`);
        if (!row || !drone) return;

        const statusCell = row.querySelector(".cell-status");
        statusCell.innerHTML = `<span class="status-badge status-${drone.status}">${drone.status.replace("_", " ")}</span>`;

        row.querySelector(".cell-position").textContent = positionOrEnRouteText(drone);

        const queueLength = (drone.commandQueue || []).length;
        row.querySelector(".cell-queue").textContent = queueLength > 0 ? `${queueLength} queued` : "—";

        row.querySelector(".cell-warning").innerHTML = warningText(drone);

        const cancelBtn = row.querySelector(".cancel-btn");
        cancelBtn.disabled = drone.status !== "in_route";
      }

      const feedbackEl = document.getElementById("command-feedback");

      document.getElementById("queue-command-btn").addEventListener("click", async () => {
        const destination = {
          x: Number(document.getElementById("dest-x").value),
          y: Number(document.getElementById("dest-y").value),
          z: Number(document.getElementById("dest-z").value)
        };

        feedbackEl.textContent = "";
        feedbackEl.className = "feedback-msg";

        try {
          await issueCommand(GROUP, selectedDroneId, destination);
          feedbackEl.textContent = `Command queued for ${selectedDroneId}.`;
          feedbackEl.classList.add("success");
        } catch (err) {
          feedbackEl.textContent = err.message;
          feedbackEl.classList.add("error");
        }
      });

      const queueSummaryEl = document.getElementById("queue-summary");
      const queueListEl = document.getElementById("queue-list");

      function renderQueuePanel() {
        const drone = droneState[selectedDroneId];
        queueListEl.innerHTML = "";

        if (!drone) {
          queueSummaryEl.textContent = "No data yet for this drone.";
          return;
        }

        const queue = drone.commandQueue || [];
        if (queue.length === 0) {
          queueSummaryEl.textContent = `${selectedDroneId} has no queued commands.`;
          return;
        }

        queueSummaryEl.textContent = `${selectedDroneId}: ${queue.length} command(s) in queue.`;

        queue.forEach((cmd, idx) => {
          const li = document.createElement("li");
          const label = idx === 0
            ? `Active → ${formatPosition(cmd.destination)}`
            : `#${idx + 1} → ${formatPosition(cmd.destination)}`;

          li.innerHTML = `<span>${label}</span>`;

          if (idx > 0) {
            const removeBtn = document.createElement("button");
            removeBtn.className = "queue-remove-btn";
            removeBtn.textContent = "Remove";
            removeBtn.addEventListener("click", () => {
              removeQueuedCommand(GROUP, selectedDroneId, cmd.commandId);
            });
            li.appendChild(removeBtn);
          } else {
            const hint = document.createElement("span");
            hint.className = "queue-count";
            hint.textContent = "use Cancel in fleet table";
            li.appendChild(hint);
          }

          queueListEl.appendChild(li);
        });
      }

      DRONE_IDS.forEach((droneId) => {
        catchUpDrone(GROUP, droneId);
        listenToDrone(GROUP, droneId, (drone) => {
          droneState[droneId] = drone;
          if (drone) renderRow(droneId, drone);
          if (droneId === selectedDroneId) renderQueuePanel();
        });
      });
    </script>

    <!-- VISUALIZATION SCRIPT — fully separate module, own imports, own
         Firestore subscriptions. Isolated from the script above. -->
    <script type="module">
      import { MISSION_CONFIG } from "../../js/games/hive-drone-explorer/config.js";
      import { catchUpDrone, listenToDrone } from "../../js/games/hive-drone-explorer/drone-engine.js";

      const errorMsgEl = document.getElementById("viz-error-msg");
      function showVizError(message) {
        errorMsgEl.textContent = message;
        errorMsgEl.style.display = "block";
        console.error("[visualization]", message);
      }

      const GROUP = "HIVE";
      const DRONE_IDS = Array.from({ length: MISSION_CONFIG.DRONE_COUNT }, (_, i) =>
        `${GROUP}-${String(i + 1).padStart(2, "0")}`
      );

      const vizDroneState = {};

      const GRID_X_KM = MISSION_CONFIG.GRID_X_KM;
      const GRID_Y_KM = MISSION_CONFIG.GRID_Y_KM;
      const GRID_X_M = GRID_X_KM * 1000;
      const GRID_Y_M = GRID_Y_KM * 1000;
      const GRID_X_HALF_KM = GRID_X_KM / 2;
      const GRID_Y_HALF_KM = GRID_Y_KM / 2;
      const DISPLAY_Z_KM = MISSION_CONFIG.DISPLAY_Z_KM;

      const STATUS_COLORS = {
        awaiting_command: "#a8cbe0",
        in_route: "#ffb347",
        collecting_sample: "#9dffbf",
        destroyed: "#ff4d4d"
      };

      function effectivePosition(drone) {
        if (drone.status === "destroyed") return drone.destructionPoint || drone.position;
        return drone.position;
      }

      function nearestKmLayer(zMeters) {
        return Math.round(zMeters / 1000);
      }

      // ================= 2D top-down + depth slider, with grid/axes =================
      // Coordinates are centered at (0,0): x and y both range from
      // -GRID_X_KM/2..+GRID_X_KM/2 (km), matching the vent/hazard geometry.
      const canvas2d = document.getElementById("viz-2d-canvas");
      const ctx2d = canvas2d.getContext("2d");
      const depthSlider = document.getElementById("depth-slider");
      const depthLabel = document.getElementById("depth-label");
      depthSlider.max = String(DISPLAY_Z_KM);

      const PAD_LEFT = 46, PAD_RIGHT = 14, PAD_TOP = 14, PAD_BOTTOM = 38;
      const plotW = canvas2d.width - PAD_LEFT - PAD_RIGHT;
      const plotH = canvas2d.height - PAD_TOP - PAD_BOTTOM;

      // North-up convention: Y=+max at the top of the plot, Y=-max at the bottom.
      function plotX(posXMeters) {
        return PAD_LEFT + ((posXMeters + GRID_X_M / 2) / GRID_X_M) * plotW;
      }
      function plotY(posYMeters) {
        return PAD_TOP + (1 - (posYMeters + GRID_Y_M / 2) / GRID_Y_M) * plotH;
      }

      function drawAxesAndGrid() {
        ctx2d.strokeStyle = "#16324a";
        ctx2d.lineWidth = 1;
        for (let i = -GRID_X_HALF_KM; i <= GRID_X_HALF_KM; i++) {
          const x = PAD_LEFT + ((i + GRID_X_HALF_KM) / GRID_X_KM) * plotW;
          ctx2d.beginPath();
          ctx2d.moveTo(x, PAD_TOP);
          ctx2d.lineTo(x, PAD_TOP + plotH);
          ctx2d.stroke();
        }
        for (let j = -GRID_Y_HALF_KM; j <= GRID_Y_HALF_KM; j++) {
          const y = PAD_TOP + (1 - (j + GRID_Y_HALF_KM) / GRID_Y_KM) * plotH;
          ctx2d.beginPath();
          ctx2d.moveTo(PAD_LEFT, y);
          ctx2d.lineTo(PAD_LEFT + plotW, y);
          ctx2d.stroke();
        }

        ctx2d.strokeStyle = "#2f9bd6";
        ctx2d.lineWidth = 1.5;
        ctx2d.strokeRect(PAD_LEFT, PAD_TOP, plotW, plotH);

        ctx2d.fillStyle = "#a8cbe0";
        ctx2d.font = "12px system-ui, sans-serif";

        ctx2d.textAlign = "center";
        ctx2d.textBaseline = "top";
        for (let i = -GRID_X_HALF_KM; i <= GRID_X_HALF_KM; i++) {
          const x = PAD_LEFT + ((i + GRID_X_HALF_KM) / GRID_X_KM) * plotW;
          ctx2d.fillText(String(i), x, PAD_TOP + plotH + 6);
        }

        ctx2d.textAlign = "right";
        ctx2d.textBaseline = "middle";
        for (let j = -GRID_Y_HALF_KM; j <= GRID_Y_HALF_KM; j++) {
          const y = PAD_TOP + (1 - (j + GRID_Y_HALF_KM) / GRID_Y_KM) * plotH;
          ctx2d.fillText(String(j), PAD_LEFT - 7, y);
        }

        ctx2d.font = "bold 13px system-ui, sans-serif";
        ctx2d.textAlign = "center";
        ctx2d.textBaseline = "alphabetic";
        ctx2d.fillText("X (km)", PAD_LEFT + plotW / 2, canvas2d.height - 6);

        ctx2d.save();
        ctx2d.translate(14, PAD_TOP + plotH / 2);
        ctx2d.rotate(-Math.PI / 2);
        ctx2d.textAlign = "center";
        ctx2d.fillText("Y (km)", 0, 0);
        ctx2d.restore();
      }

      function draw2D() {
        const layer = Number(depthSlider.value);
        depthLabel.textContent = `Layer: ${layer} km`;

        ctx2d.clearRect(0, 0, canvas2d.width, canvas2d.height);
        drawAxesAndGrid();

        Object.entries(vizDroneState).forEach(([droneId, drone]) => {
          if (!drone) return;
          const pos = effectivePosition(drone);
          if (!pos) return;
          if (nearestKmLayer(pos.z) !== layer) return;

          const px = plotX(pos.x);
          const py = plotY(pos.y);

          ctx2d.beginPath();
          ctx2d.arc(px, py, drone.status === "destroyed" ? 8 : 7, 0, Math.PI * 2);
          ctx2d.fillStyle = STATUS_COLORS[drone.status] || "#ffffff";
          ctx2d.fill();
        });
      }

      depthSlider.addEventListener("input", draw2D);
      draw2D();

      // ================= Tabs =================
      const tabBtn2d = document.getElementById("tab-btn-2d");
      const tabBtn3d = document.getElementById("tab-btn-3d");
      const tabContent2d = document.getElementById("tab-2d");
      const tabContent3d = document.getElementById("tab-3d");

      let active3D = false;
      let animationFrameId = null;

      function showTab(tab) {
        const is2d = tab === "2d";
        tabBtn2d.classList.toggle("active", is2d);
        tabBtn3d.classList.toggle("active", !is2d);
        tabContent2d.classList.toggle("active", is2d);
        tabContent3d.classList.toggle("active", !is2d);

        active3D = !is2d;

        if (active3D) {
          startThreeD();
        } else {
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
          draw2D();
        }
      }

      tabBtn2d.addEventListener("click", () => showTab("2d"));
      tabBtn3d.addEventListener("click", () => showTab("3d"));

      // ================= 3D cube (three.js via import map) =================
      let THREE = null;
      let OrbitControls = null;
      let threeLoadAttempted = false;
      let threeLoadFailed = false;

      let scene, camera, renderer, controls;
      const droneMeshes = {};

      // Coordinates are already centered at (0,0) in x/y — no offset needed.
      function sceneX(posXMeters) { return posXMeters / 1000; }
      function sceneZ(posYMeters) { return posYMeters / 1000; }
      function sceneY(posZMeters) { return -(posZMeters / 1000); }

      async function loadThreeIfNeeded() {
        if (threeLoadAttempted) return !threeLoadFailed;
        threeLoadAttempted = true;
        try {
          THREE = await import("three");
          const mod = await import("three/addons/controls/OrbitControls.js");
          OrbitControls = mod.OrbitControls;
          return true;
        } catch (err) {
          threeLoadFailed = true;
          showVizError("3D view failed to load (network or CDN issue). 2D map still works normally.");
          console.error(err);
          return false;
        }
      }

      function init3D() {
        if (scene) return;

        const container = document.getElementById("viz-3d-container");

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x08161f);

        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(18, 16, 28);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, -DISPLAY_Z_KM / 2, 0);
        controls.enablePan = true;
        controls.screenSpacePanning = true; // pan moves camera in screen-space up/down/left/right
        controls.panSpeed = 1.2;
        controls.minDistance = 2;
        controls.maxDistance = 250;
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.zoomToCursor = true; // zoom in/out toward wherever the cursor is, not just the center
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        // Wireframe box representing the mission volume (false depth framing).
        const boxGeom = new THREE.BoxGeometry(GRID_X_KM, DISPLAY_Z_KM, GRID_Y_KM);
        const edges = new THREE.EdgesGeometry(boxGeom);
        const boxLines = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x2f9bd6 }));
        boxLines.position.set(0, -DISPLAY_Z_KM / 2, 0);
        scene.add(boxLines);

        // ===== Grid throughout the volume, not just top/bottom =====
        // Horizontal 1km-square reference planes at several depths, evenly
        // spaced through the full height, so there's always a nearby plane
        // to judge scale against no matter how deep you're looking.
        const NUM_HORIZONTAL_PLANES = 8; // e.g. every 10km across a 70km depth
        for (let i = 0; i <= NUM_HORIZONTAL_PLANES; i++) {
          const depthFraction = i / NUM_HORIZONTAL_PLANES;
          const planeY = -depthFraction * DISPLAY_Z_KM;
          const grid = new THREE.GridHelper(GRID_X_KM, GRID_X_KM, 0x2f9bd6, 0x16324a);
          grid.position.set(0, planeY, 0);
          grid.material.opacity = 0.35;
          grid.material.transparent = true;
          scene.add(grid);
        }

        // Vertical lattice lines connecting every 1km (x,y) grid intersection
        // from the surface straight down to the floor — makes the volume
        // read as a true 3D grid rather than a stack of flat squares.
        const latticePoints = [];
        for (let xi = -GRID_X_KM / 2; xi <= GRID_X_KM / 2; xi++) {
          for (let yi = -GRID_Y_KM / 2; yi <= GRID_Y_KM / 2; yi++) {
            latticePoints.push(xi, 0, yi);
            latticePoints.push(xi, -DISPLAY_Z_KM, yi);
          }
        }
        const latticeGeom = new THREE.BufferGeometry();
        latticeGeom.setAttribute("position", new THREE.Float32BufferAttribute(latticePoints, 3));
        const latticeMat = new THREE.LineBasicMaterial({ color: 0x16324a, transparent: true, opacity: 0.35 });
        const lattice = new THREE.LineSegments(latticeGeom, latticeMat);
        scene.add(lattice);

        window.addEventListener("resize", resize3D);
      }

      function resize3D() {
        if (!renderer) return;
        const container = document.getElementById("viz-3d-container");
        const w = container.clientWidth, h = container.clientHeight;
        if (w === 0 || h === 0) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function getOrCreateMesh(droneId) {
        if (droneMeshes[droneId]) return droneMeshes[droneId];
        const geom = new THREE.SphereGeometry(0.4, 16, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0xa8cbe0 });
        const mesh = new THREE.Mesh(geom, mat);
        scene.add(mesh);
        droneMeshes[droneId] = mesh;
        return mesh;
      }

      function draw3D() {
        if (!scene) return;
        Object.entries(vizDroneState).forEach(([droneId, drone]) => {
          if (!drone) return;
          const pos = effectivePosition(drone);
          if (!pos) return;

          const mesh = getOrCreateMesh(droneId);
          mesh.position.set(sceneX(pos.x), sceneY(pos.z), sceneZ(pos.y));
          mesh.material.color.set(STATUS_COLORS[drone.status] || "#ffffff");
          mesh.scale.setScalar(drone.status === "destroyed" ? 1.6 : 1);
        });
      }

      function animate3D() {
        if (!active3D) return;
        animationFrameId = requestAnimationFrame(animate3D);
        controls.update();
        renderer.render(scene, camera);
      }

      async function startThreeD() {
        const ok = await loadThreeIfNeeded();
        if (!ok) return;
        init3D();
        resize3D();
        if (!animationFrameId) animate3D();
        draw3D();
      }

      DRONE_IDS.forEach((droneId) => {
        catchUpDrone(GROUP, droneId);
        listenToDrone(GROUP, droneId, (drone) => {
          vizDroneState[droneId] = drone;
          if (active3D) draw3D(); else draw2D();
        });
      });
    </script>
</body>
</html>
