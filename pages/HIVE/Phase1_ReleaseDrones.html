<!-- HIVE game page: drone release/movement control panel. Participant-only, HIVE group. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enceladus Mission Simulator - HIVE - Drone Operations</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .ops-layout {
            display: flex;
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
            box-sizing: border-box;
            align-items: flex-start;
        }
        .panel {
            background: #12293d;
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }
        .fleet-panel { flex: 2; min-width: 0; }
        .command-panel { flex: 1; min-width: 280px; position: sticky; top: 1rem; }

        table.fleet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .fleet-table th {
            text-align: left;
            color: #a8cbe0;
            padding: 0.4rem;
            border-bottom: 1px solid #1c3c56;
            position: sticky;
            top: 0;
            background: #12293d;
        }
        .fleet-table td {
            padding: 0.4rem;
            border-bottom: 1px solid #1c3c56;
            vertical-align: top;
        }
        .fleet-scroll {
            max-height: 70vh;
            overflow-y: auto;
        }

        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .status-awaiting_command { background: #2c4a5e; color: #a8cbe0; }
        .status-in_route { background: #1c4a72; color: #7fd8ff; }
        .status-collecting_sample { background: #235c3a; color: #9dffbf; }
        .status-destroyed { background: #5c2323; color: #ff9d9d; }

        .warning-text {
            color: #ffcf6b;
            font-weight: bold;
            font-size: 0.78rem;
        }
        .destruction-text {
            color: #ff8080;
            font-size: 0.78rem;
        }
        .position-text {
            font-family: monospace;
            font-size: 0.8rem;
            color: #cfeaff;
        }
        .queue-count {
            font-size: 0.75rem;
            color: #7fa8c4;
        }

        .cancel-btn {
            background: #a83232;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .cancel-btn:disabled {
            background: #3a3a3a;
            color: #777;
            cursor: not-allowed;
        }

        .command-panel label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: #a8cbe0; }
        .command-panel select, .command-panel input {
            width: 100%;
            padding: 0.4rem;
            margin-top: 0.25rem;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        .command-panel button {
            margin-top: 1rem;
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 5px;
            background: #2f9bd6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .command-panel button:hover { background: #237bab; }

        .queue-list {
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .queue-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0;
            border-bottom: 1px solid #1c3c56;
        }
        .queue-remove-btn {
            background: none;
            border: 1px solid #a83232;
            color: #ff9d9d;
            border-radius: 4px;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            cursor: pointer;
        }

        .feedback-msg {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            min-height: 1rem;
        }
        .feedback-msg.error { color: #ff8080; }
        .feedback-msg.success { color: #9dffbf; }

        h1, h2 { margin-top: 0; }
        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.05rem; color: #a8cbe0; }
    </style>
</head>
<body>

    <div class="ops-layout">
        <div class="panel fleet-panel">
            <h1>HIVE Drone Fleet</h1>
            <div class="fleet-scroll">
                <table class="fleet-table">
                    <thead>
                        <tr>
                            <th>Drone</th>
                            <th>Status</th>
                            <th>Position / En Route To</th>
                            <th>Queue</th>
                            <th>Warning</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="fleet-table-body">
                        <!-- rows populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel command-panel">
            <h2>Issue Command</h2>

            <label for="drone-select">Select Drone</label>
            <select id="drone-select"></select>

            <label for="dest-x">X (m)</label>
            <input type="number" id="dest-x" value="0">
            <label for="dest-y">Y (m)</label>
            <input type="number" id="dest-y" value="0">
            <label for="dest-z">Z (m)</label>
            <input type="number" id="dest-z" value="0">

            <button id="queue-command-btn">Queue Command</button>
            <p id="command-feedback" class="feedback-msg"></p>

            <h2>Queued Commands</h2>
            <p class="queue-count" id="queue-summary">Select a drone to view its queue.</p>
            <ul class="queue-list" id="queue-list"></ul>
        </div>
    </div>

    <script src="../../js/auth-guard.js"></script>
    <script>
      const user = requireAuth("participant", "HIVE", "../../index.html");
    </script>

    <script type="module">
      import { MISSION_CONFIG } from "../../js/games/hive-drone-explorer/config.js";
      import {
        issueCommand, cancelActiveCommand, removeQueuedCommand, catchUpDrone, listenToDrone
      } from "../../js/games/hive-drone-explorer/drone-engine.js";

      const GROUP = "HIVE";
      const DRONE_IDS = Array.from({ length: MISSION_CONFIG.DRONE_COUNT }, (_, i) =>
        `${GROUP}-${String(i + 1).padStart(2, "0")}`
      );

      const droneState = {}; // droneId -> latest Firestore data
      let selectedDroneId = DRONE_IDS[0];

      // --- Build the drone selector dropdown once ---
      const selectEl = document.getElementById("drone-select");
      DRONE_IDS.forEach((id) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        selectEl.appendChild(opt);
      });
      selectEl.value = selectedDroneId;
      selectEl.addEventListener("change", () => {
        selectedDroneId = selectEl.value;
        renderQueuePanel();
      });

      // --- Build one table row per drone, plus subscribe to live updates ---
      const tbody = document.getElementById("fleet-table-body");

      function formatPosition(pos) {
        if (!pos) return "—";
        return `(${pos.x}, ${pos.y}, ${pos.z})`;
      }

      function positionOrEnRouteText(drone) {
        const queue = drone.commandQueue || [];
        if (drone.status === "in_route" && queue.length > 0) {
          return `→ ${formatPosition(queue[0].destination)}`;
        }
        if (drone.status === "collecting_sample" && queue.length > 0) {
          return `Collecting at ${formatPosition(queue[0].destination)}`;
        }
        if (drone.status === "destroyed") {
          return `Lost at ${formatPosition(drone.destructionPoint)}`;
        }
        return formatPosition(drone.position);
      }

      function warningText(drone) {
        if (drone.status === "destroyed") {
          const d = drone.destruction;
          if (!d) return "";
          return `<span class="destruction-text">Destroyed: ${d.label}</span>`;
        }
        const w = drone.hazardWarning;
        if (w && w.active) {
          return `<span class="warning-text">⚠ ${w.label} in ~${w.distanceBeforeImpactM}m</span>`;
        }
        return "";
      }

      function buildRow(droneId) {
        const tr = document.createElement("tr");
        tr.id = `row-${droneId}`;
        tr.innerHTML = `
          <td>${droneId}</td>
          <td class="cell-status"></td>
          <td class="cell-position position-text"></td>
          <td class="cell-queue queue-count"></td>
          <td class="cell-warning"></td>
          <td><button class="cancel-btn" data-drone="${droneId}">Cancel</button></td>
        `;
        return tr;
      }

      DRONE_IDS.forEach((id) => tbody.appendChild(buildRow(id)));

      tbody.addEventListener("click", (e) => {
        const btn = e.target.closest(".cancel-btn");
        if (!btn) return;
        cancelActiveCommand(GROUP, btn.dataset.drone);
      });

      function renderRow(droneId, drone) {
        const row = document.getElementById(`row-${droneId}`);
        if (!row || !drone) return;

        const statusCell = row.querySelector(".cell-status");
        statusCell.innerHTML = `<span class="status-badge status-${drone.status}">${drone.status.replace("_", " ")}</span>`;

        row.querySelector(".cell-position").textContent = positionOrEnRouteText(drone);

        const queueLength = (drone.commandQueue || []).length;
        row.querySelector(".cell-queue").textContent = queueLength > 0 ? `${queueLength} queued` : "—";

        row.querySelector(".cell-warning").innerHTML = warningText(drone);

        const cancelBtn = row.querySelector(".cancel-btn");
        cancelBtn.disabled = drone.status !== "in_route";
      }

      // --- Command entry ---
      const feedbackEl = document.getElementById("command-feedback");

      document.getElementById("queue-command-btn").addEventListener("click", async () => {
        const destination = {
          x: Number(document.getElementById("dest-x").value),
          y: Number(document.getElementById("dest-y").value),
          z: Number(document.getElementById("dest-z").value)
        };

        feedbackEl.textContent = "";
        feedbackEl.className = "feedback-msg";

        try {
          await issueCommand(GROUP, selectedDroneId, destination);
          feedbackEl.textContent = `Command queued for ${selectedDroneId}.`;
          feedbackEl.classList.add("success");
        } catch (err) {
          feedbackEl.textContent = err.message;
          feedbackEl.classList.add("error");
        }
      });

      // --- Queue panel for the selected drone (edit/cancel not-yet-active commands) ---
      const queueSummaryEl = document.getElementById("queue-summary");
      const queueListEl = document.getElementById("queue-list");

      function renderQueuePanel() {
        const drone = droneState[selectedDroneId];
        queueListEl.innerHTML = "";

        if (!drone) {
          queueSummaryEl.textContent = "No data yet for this drone.";
          return;
        }

        const queue = drone.commandQueue || [];
        if (queue.length === 0) {
          queueSummaryEl.textContent = `${selectedDroneId} has no queued commands.`;
          return;
        }

        queueSummaryEl.textContent = `${selectedDroneId}: ${queue.length} command(s) in queue.`;

        queue.forEach((cmd, idx) => {
          const li = document.createElement("li");
          const label = idx === 0
            ? `Active → ${formatPosition(cmd.destination)}`
            : `#${idx + 1} → ${formatPosition(cmd.destination)}`;

          li.innerHTML = `<span>${label}</span>`;

          if (idx > 0) {
            const removeBtn = document.createElement("button");
            removeBtn.className = "queue-remove-btn";
            removeBtn.textContent = "Remove";
            removeBtn.addEventListener("click", () => {
              removeQueuedCommand(GROUP, selectedDroneId, cmd.commandId);
            });
            li.appendChild(removeBtn);
          } else {
            const hint = document.createElement("span");
            hint.className = "queue-count";
            hint.textContent = "use Cancel in fleet table";
            li.appendChild(hint);
          }

          queueListEl.appendChild(li);
        });
      }

      // --- Subscribe to every drone, catch up any missed time, keep UI live ---
      DRONE_IDS.forEach((droneId) => {
        catchUpDrone(GROUP, droneId);
        listenToDrone(GROUP, droneId, (drone) => {
          droneState[droneId] = drone;
          if (drone) renderRow(droneId, drone);
          if (droneId === selectedDroneId) renderQueuePanel();
        });
      });
    </script>
</body>
</html>
