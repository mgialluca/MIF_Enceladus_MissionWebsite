<!-- Admin page: restricted view for admin-role users to oversee/manage the mission simulation -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mission Control - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>Mission Control</h1>
        <p>Click a game to unlock it for that group.</p>
        <div id="admin-controls"></div>
    </div>

    <script src="../js/auth-guard.js"></script>
    <script>
      const user = requireAuth("admin", null, "../index.html");
    </script>

    <script type="module">
      import { GAMES_CONFIG } from "../js/games-config.js";
      import { listenToUnlocks, unlockGame, relockGame } from "../js/mission-data.js";

      const container = document.getElementById("admin-controls");
      let currentUnlocks = {};

      listenToUnlocks((unlocks) => {
        currentUnlocks = unlocks;
        render();
      });

      function render() {
        container.innerHTML = "";
        Object.keys(GAMES_CONFIG).forEach((group) => {
          const groupHeader = document.createElement("h3");
          groupHeader.textContent = group;
          container.appendChild(groupHeader);

          const unlockedIds = currentUnlocks[`${group}_unlocked`] || [];

          GAMES_CONFIG[group].forEach((game) => {
          const btn = document.createElement("button");
          const isUnlocked = unlockedIds.includes(game.id);

          btn.textContent = isUnlocked
              ? `🔓 ${game.title} — click to relock`
              : `🔒 ${game.title} — click to unlock`;
          btn.style.display = "block";
          btn.style.margin = "0.4rem 0";
          btn.className = isUnlocked ? "unlock-btn unlocked" : "unlock-btn locked";

          btn.addEventListener("click", () => {
              if (isUnlocked) {
              relockGame(group, game.id);
              } else {
              unlockGame(group, game.id);
              }
          });

          container.appendChild(btn);
          });
        });
      }
      const RESET_FUNCTION_URL = "https://us-central1-enceladus-mission-simulation.cloudfunctions.net/reset_group";

      async function resetGroup(group) {
        const confirmed = confirm(`Reset ALL drones and collected-data counters for ${group}? This cannot be undone.`);
        if (!confirmed) return;

        const res = await fetch(RESET_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ group })
        });

        if (res.ok) {
          alert(`${group} has been reset.`);
        } else {
          alert(`Reset failed for ${group}. Check console for details.`);
          console.error(await res.text());
        }
      }

      // Add reset buttons, one per group, near the top of the admin controls
      const resetSection = document.createElement("div");
      resetSection.innerHTML = "<h3>Testing Controls</h3>";
      Object.keys(GAMES_CONFIG).forEach((group) => {
        const btn = document.createElement("button");
        btn.textContent = `⚠️ Reset ${group}`;
        btn.style.margin = "0.4rem 0.4rem 0.4rem 0";
        btn.style.background = "#a83232";
        btn.addEventListener("click", () => resetGroup(group));
        resetSection.appendChild(btn);
      });
      container.parentNode.insertBefore(resetSection, container);
    </script>
</body>
</html>
