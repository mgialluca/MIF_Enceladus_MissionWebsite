<!-- Admin page: restricted view for admin-role users to oversee/manage the mission simulation -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mission Control - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Override the shared login-page body layout — that stylesheet
           centers a fixed-height box, which clips the top once this page's
           content (unlock buttons, reset controls, cytometer panel) grows
           taller than the viewport. Same fix as the two game pages. */
        body {
            display: block;
            height: auto;
            min-height: 100vh;
            align-items: normal;
            justify-content: normal;
            overflow-x: auto;
        }
        .login-container {
            margin: 2rem auto;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Mission Control</h1>
        <p>Click a game to unlock it for that group.</p>
        <div id="admin-controls"></div>
    </div>

    <script src="../js/auth-guard.js"></script>
    <script>
      const user = requireAuth("admin", null, "../index.html");
    </script>

    <script type="module">
      import { GAMES_CONFIG } from "../js/games-config.js";
      import { listenToUnlocks, unlockGame, relockGame } from "../js/mission-data.js";
      import { listenToTether, swapStationCytometers } from "../js/games/whitewhale-tether/tether-engine.js";

      const container = document.getElementById("admin-controls");
      let currentUnlocks = {};

      listenToUnlocks((unlocks) => {
        currentUnlocks = unlocks;
        render();
      });

      function render() {
        container.innerHTML = "";
        Object.keys(GAMES_CONFIG).forEach((group) => {
          const groupHeader = document.createElement("h3");
          groupHeader.textContent = group;
          container.appendChild(groupHeader);

          const unlockedIds = currentUnlocks[`${group}_unlocked`] || [];

          GAMES_CONFIG[group].forEach((game) => {
          const btn = document.createElement("button");
          const isUnlocked = unlockedIds.includes(game.id);

          btn.textContent = isUnlocked
              ? `🔓 ${game.title} — click to relock`
              : `🔒 ${game.title} — click to unlock`;
          btn.style.display = "block";
          btn.style.margin = "0.4rem 0";
          btn.className = isUnlocked ? "unlock-btn unlocked" : "unlock-btn locked";

          btn.addEventListener("click", () => {
              if (isUnlocked) {
              relockGame(group, game.id);
              } else {
              unlockGame(group, game.id);
              }
          });

          container.appendChild(btn);
          });
        });
      }
      const RESET_FUNCTION_URL = "https://us-central1-enceladus-mission-simulation.cloudfunctions.net/reset_group";

      async function resetGroup(group) {
        const confirmed = confirm(`Reset ALL drones and collected-data counters for ${group}? This cannot be undone.`);
        if (!confirmed) return;

        const res = await fetch(RESET_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ group })
        });

        if (res.ok) {
          alert(`${group} has been reset.`);
        } else {
          alert(`Reset failed for ${group}. Check console for details.`);
          console.error(await res.text());
        }
      }

      // Add reset buttons, one per group, near the top of the admin controls
      const resetSection = document.createElement("div");
      resetSection.innerHTML = "<h3>Testing Controls</h3>";
      Object.keys(GAMES_CONFIG).forEach((group) => {
        const btn = document.createElement("button");
        btn.textContent = `⚠️ Reset ${group}`;
        btn.style.margin = "0.4rem 0.4rem 0.4rem 0";
        btn.style.background = "#a83232";
        btn.addEventListener("click", () => resetGroup(group));
        resetSection.appendChild(btn);
      });
      container.parentNode.insertBefore(resetSection, container);

      // ===================== WhiteWhale flow cytometer re-allocation =====================
      const CYTOMETER_STATUS_LABEL = { operational: "Operational", service_worn: "Service-worn", broken: "Broken" };

      const cytometerSection = document.createElement("div");
      cytometerSection.innerHTML =
        "<h3>WhiteWhale Flow Cytometers</h3>" +
        "<p style=\"font-size:0.85rem;\">Swaps the flow-cytometer wear state between two stations — " +
        "use this to move a functional cytometer onto a broken station.</p>";

      const cytometerList = document.createElement("ul");
      cytometerList.style.listStyle = "none";
      cytometerList.style.padding = "0";
      cytometerSection.appendChild(cytometerList);

      const swapRow = document.createElement("div");
      swapRow.style.margin = "0.5rem 0";
      const fromSelect = document.createElement("select");
      const toSelect = document.createElement("select");
      [fromSelect, toSelect].forEach((sel) => { sel.style.margin = "0 0.4rem 0.4rem 0"; });
      const swapBtn = document.createElement("button");
      swapBtn.textContent = "Swap Flow Cytometers";
      swapRow.append("From: ", fromSelect, " To: ", toSelect, swapBtn);
      cytometerSection.appendChild(swapRow);

      const cytometerFeedback = document.createElement("p");
      cytometerFeedback.style.fontSize = "0.85rem";
      cytometerSection.appendChild(cytometerFeedback);

      let latestTether = null;

      function renderCytometerSection() {
        cytometerList.innerHTML = "";
        fromSelect.innerHTML = "";
        toSelect.innerHTML = "";

        const stations = latestTether?.stations || [];
        stations.forEach((s) => {
          const status = s.cytometer?.status || "operational";
          const statusLabel = CYTOMETER_STATUS_LABEL[status] || status;

          const li = document.createElement("li");
          li.textContent = `${s.label}: ${statusLabel} (${s.cytometer?.totalVolumeFilteredL ?? 0} L filtered)`;
          cytometerList.appendChild(li);

          [fromSelect, toSelect].forEach((sel) => {
            const opt = document.createElement("option");
            opt.value = s.id;
            opt.textContent = `${s.label} (${statusLabel})`;
            sel.appendChild(opt);
          });
        });
      }

      listenToTether((data) => {
        latestTether = data;
        renderCytometerSection();
      });

      swapBtn.addEventListener("click", async () => {
        cytometerFeedback.textContent = "";
        if (fromSelect.value === toSelect.value) {
          cytometerFeedback.textContent = "Choose two different stations.";
          return;
        }
        try {
          await swapStationCytometers(fromSelect.value, toSelect.value);
          cytometerFeedback.textContent = "Flow cytometers swapped.";
        } catch (err) {
          cytometerFeedback.textContent = err.message;
        }
      });

      container.parentNode.insertBefore(cytometerSection, container);
    </script>
</body>
</html>
